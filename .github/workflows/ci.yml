name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: "1"          # no test may ever call a live API
      SAMVAD_SECRET: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check src tests
      - name: contract tests
        run: pytest tests/contract -v
      - name: all tests
        run: pytest -v
